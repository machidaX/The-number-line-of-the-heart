<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心の数直線 - 臓器提供の意思</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML要素を画像化するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; 
        }

        /* カスタムスライダーのスタイリング */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            border: 3px solid #64748b;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            border-color: #334155;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 5px;
        }

        input[type=range]:focus {
            outline: none;
        }

        .heart-svg {
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.12));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-slate-800 p-4">

    <main class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-6 sm:p-10 flex flex-col items-center relative">
        
        <h1 class="text-2xl sm:text-3xl font-bold mb-3 text-center text-slate-700">心の数直線</h1>

        <!-- キャプチャ対象（ハートと数値） -->
        <div id="captureArea" class="relative w-72 h-72 sm:w-80 sm:h-80 md:w-96 md:h-96 mb-3 flex items-center justify-center p-4 bg-white rounded-2xl">
            <!-- SVGの linearGradient を使用し、ハートの左右幅に対して正確に色を塗る -->
            <svg viewBox="0 0 24 24" class="w-full h-full heart-svg">
                <defs>
                    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop id="stopGreen" offset="50%" stop-color="#4ade80" />
                        <stop id="stopPink" offset="50%" stop-color="#f472b6" />
                    </linearGradient>
                </defs>
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGradient)" />
            </svg>
            
            <!-- 数値表示をハートの中央に配置 -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="flex gap-2 sm:gap-3 items-baseline bg-white/90 px-6 py-3 rounded-full backdrop-blur-md shadow-lg border border-white/60">
                    <span class="text-green-600 font-bold text-3xl sm:text-4xl" id="greenText">50%</span>
                    <span class="text-slate-300 text-2xl font-light">/</span>
                    <span class="text-pink-600 font-bold text-3xl sm:text-4xl" id="pinkText">50%</span>
                </div>
            </div>
        </div>

        <!-- スライダー操作領域 (ハート直下に位置調整) -->
        <div class="w-full max-w-md space-y-3 mb-6">
            <!-- 左右のラベル -->
            <div class="flex justify-between items-center text-lg sm:text-xl font-bold">
                <div class="flex items-center gap-2 text-green-600">
                    <span class="w-4 h-4 rounded-full bg-green-400 inline-block"></span>
                    する
                </div>
                <div class="flex items-center gap-2 text-pink-600">
                    しない
                    <span class="w-4 h-4 rounded-full bg-pink-400 inline-block"></span>
                </div>
            </div>

            <!-- スライダー入力 -->
            <input 
                type="range" 
                id="slider" 
                min="0" 
                max="100" 
                value="50" 
                class="w-full"
                aria-label="心の数直線スライダー"
            >
            
            <p class="text-center text-slate-500 text-xs sm:text-sm">
                スライダーを動かして、今の気持ちの割合を表してみましょう
            </p>
        </div>

        <!-- ロイロノート貼り付け用ボタン -->
        <button 
            id="copyBtn"
            class="w-full max-w-md bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-3 group"
        >
            <svg class="w-5 h-5 text-indigo-200 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
            </svg>
            <span>画像をコピー (ロイロノートに Ctrl+V)</span>
        </button>

        <!-- 通知トースト -->
        <div id="toast" class="opacity-0 pointer-events-none fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 text-sm sm:text-base font-medium flex items-center gap-2 transition-all duration-300">
            <span id="toastIcon">✅</span>
            <span id="toastMsg">コピーしました！ロイロノート等に貼り付けられます</span>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('slider');
            const stopGreen = document.getElementById('stopGreen');
            const stopPink = document.getElementById('stopPink');
            const greenText = document.getElementById('greenText');
            const pinkText = document.getElementById('pinkText');
            
            const copyBtn = document.getElementById('copyBtn');
            const captureArea = document.getElementById('captureArea');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            // スライダーの更新処理
            function updateHeart() {
                const greenPercentage = parseInt(slider.value, 10);
                
                stopGreen.setAttribute('offset', `${greenPercentage}%`);
                stopPink.setAttribute('offset', `${greenPercentage}%`);

                greenText.textContent = `${greenPercentage}%`;
                pinkText.textContent = `${100 - greenPercentage}%`;
            }

            // 初回描画＆スライダーイベントのリスナー設定
            updateHeart();
            slider.addEventListener('input', updateHeart);

            // トースト表示機能
            let toastTimer = null;
            function showToast(message, isSuccess = true) {
                toastMsg.textContent = message;
                toastIcon.textContent = isSuccess ? '✅' : '📥';
                
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3500);
            }

            // クリップボード書き込み・コピー機能
            copyBtn.addEventListener('click', async () => {
                copyBtn.disabled = true;
                copyBtn.style.opacity = '0.7';

                try {
                    // ハートと数値部分をキャンバスとしてレンダリング
                    const canvas = await html2canvas(captureArea, {
                        backgroundColor: '#ffffff',
                        scale: 2, // 高解像度キャプチャ
                        logging: false
                    });

                    // Blob（画像データ）に変換
                    canvas.toBlob(async (blob) => {
                        if (!blob) {
                            showToast('画像の生成に失敗しました', false);
                            resetBtn();
                            return;
                        }

                        try {
                            // クリップボードに画像をコピー
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            showToast('コピーしました！ロイロノートに Ctrl+V で貼り付けられます', true);
                        } catch (err) {
                            console.warn('Clipboard API error, downloading instead:', err);
                            // クリップボード制限があるブラウザ用のフォールバック（自動保存）
                            const link = document.createElement('a');
                            link.download = '心の数直線.png';
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            showToast('画像をダウンロードしました！ロイロノートに提出できます', false);
                        } finally {
                            resetBtn();
                        }
                    }, 'image/png');

                } catch (error) {
                    console.error('Capture error:', error);
                    showToast('コピー中にエラーが発生しました', false);
                    resetBtn();
                }
            });

            function resetBtn() {
                copyBtn.disabled = false;
                copyBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
